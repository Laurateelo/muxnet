name: Windows lab verification

on:
  push:
    branches: [codex/android-lab2-windows]
  workflow_dispatch:
    inputs:
      device_tests:
        description: Run 21 checks in a disposable Android emulator
        type: boolean
        default: true
      studio_capture:
        description: Open the project in Android Studio and capture its actual desktop
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: shoppingcart-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify on Windows
        env:
          RUN_DEVICE_TESTS: ${{ github.event_name == 'push' || inputs.device_tests }}
        run: ./tools/windows-ci.ps1 -DeviceTests:($env:RUN_DEVICE_TESTS -eq 'true')
      - name: Capture actual Android Studio desktop
        if: ${{ always() && (github.event_name == 'push' || inputs.studio_capture) }}
        timeout-minutes: 18
        run: ./tools/capture-studio-windows.ps1
      - name: Save original logs, APK and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-lab-evidence-${{ github.run_id }}
          path: artifacts/windows
          if-no-files-found: error
          retention-days: 7
      - name: Stop the disposable emulator
        if: ${{ always() && (github.event_name == 'push' || inputs.device_tests) }}
        run: |
          $ErrorActionPreference = 'Continue'
          $adb = Join-Path $env:ANDROID_HOME 'platform-tools/adb.exe'
          if (Test-Path $adb) { & $adb -s emulator-5554 emu kill }
          exit 0
