plugins { id 'com.android.application' }
android {
    namespace 'cn.edu.hnie.shoppingcart'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.edu.hnie.shoppingcart'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'cn.edu.hnie.shoppingcart.CartInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
